server {
    listen 7860;
    server_name localhost;
    root /var/www/public;
    index index.php;

    client_max_body_size 64M;

    # Allow Hugging Face to display this in an iframe
    add_header X-Frame-Options "ALLOW-FROM https://huggingface.co";
    add_header Content-Security-Policy "frame-ancestors 'self' https://huggingface.co https://*.hf.space";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Ensure Laravel knows we are using HTTPS
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}