server {
    # Port 7860 is required for Hugging Face, but we can also use it for local
    listen 7860;
    server_name localhost;
    root /var/www/public;
    index index.php;

    client_max_body_size 64M;

    # Allow Hugging Face to display this in an iframe
    add_header X-Frame-Options "ALLOW-FROM https://huggingface.co";
    add_header Content-Security-Policy "frame-ancestors 'self' https://huggingface.co https://*.hf.space";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # LOCAL: Connect to the 'laravel' container
        # CLOUD: Connect to localhost (127.0.0.1)
        # We use a variable to try both
        fastcgi_pass voice_laravel:9000;
        
        # Fallback for cloud environment where it's 127.0.0.1
        error_page 502 = @cloud_php;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location @cloud_php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}
